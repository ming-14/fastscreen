name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Build (${{ matrix.arch }})
        run: python build.py --arch ${{ matrix.arch }}

      - name: Run Tests
        # x64/x86: 可用对应架构的 Python 加载 DLL 运行测试
        # ARM64: 当前 GH Actions 无 ARM64 Windows runner，仅编译验证
        if: matrix.arch != 'arm64'
        run: python -m pytest tests/ -v

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: fastscreen-${{ matrix.arch }}
          path: fastscreencore/${{ matrix.arch }}/fastscreen.dll
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/fastscreen-x64/fastscreen.dll release/fastscreen-win-x86_64.dll
          cp artifacts/fastscreen-x86/fastscreen.dll  release/fastscreen-win-x86.dll
          cp artifacts/fastscreen-arm64/fastscreen.dll release/fastscreen-win-arm64.dll
          ls -la release/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/*
          --title "$GITHUB_REF_NAME"
          --generate-notes